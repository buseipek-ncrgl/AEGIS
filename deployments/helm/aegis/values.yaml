# Default values for aegis helm chart.

global:
  environment: production
  namespace: aegis-system

api:
  replicaCount: 2
  image:
    repository: aegis-api
    tag: v3.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 5000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

analytics:
  replicaCount: 2
  image:
    repository: aegis-analytics
    tag: v3.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 600m
      memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
