# ==============================================================================
# AEGIS ENTERPRISE CLOUD-NATIVE PLATFORM
# Kubernetes (K8s) Horizontal Pod Autoscaler (HPA) Manifest
# ==============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-api-hpa
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-api-hpa
    app.kubernetes.io/part-of: aegis-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-api-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-analytics-hpa
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-analytics-hpa
    app.kubernetes.io/part-of: aegis-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-analytics-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
