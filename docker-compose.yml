services:
  aegis-db:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis_db
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password_123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  aegis-redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    restart: always

  aegis-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aegis-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: always

  aegis-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aegis-kafka
    depends_on:
      - aegis-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: aegis-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  aegis-prometheus:
    image: prom/prometheus:v2.47.0
    container_name: aegis-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  aegis-grafana:
    image: grafana/grafana:10.1.0
    container_name: aegis-grafana
    depends_on:
      - aegis-prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

  aegis-api:
    build:
      context: .
      dockerfile: services/aegis-api/Dockerfile
    container_name: aegis-api
    depends_on:
      - aegis-db
      - aegis-redis
      - aegis-kafka
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=aegis-db;Port=5432;Database=aegis_db;Username=aegis_user;Password=aegis_password_123!
      - ConnectionStrings__Redis=aegis-redis:6379
      - Kafka__BootstrapServers=aegis-kafka:9092
    restart: always

  aegis-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aegis-web
    depends_on:
      - aegis-api
    ports:
      - "3000:3000"
    restart: always

  aegis-simulator:
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    container_name: aegis-simulator
    depends_on:
      - aegis-api
    environment:
      - API_BASE_URL=http://aegis-api:5000/api
    restart: always

volumes:
  postgres_data:
  grafana_data:
