syntax = "proto3";

option csharp_namespace = "Aegis.Api.Protos";

package aegis.telemetry;

// AEGIS Yüksek Hızlı Binary Telemetri gRPC Servisi
service TelemetryGrpc {
  // Tekil Telemetri Kaydı (Unary RPC)
  rpc RecordTelemetry (TelemetryRecordRequest) returns (TelemetryRecordResponse);

  // En Son Telemetriyi Sorgula (Unary RPC)
  rpc GetLatestTelemetry (GetLatestTelemetryRequest) returns (TelemetryRecordResponse);
}

// Telemetri Gönderim İsteği
message TelemetryRecordRequest {
  string vehicle_id = 1;
  double latitude = 2;
  double longitude = 3;
  double altitude = 4;
  double speed = 5;
  double battery_percentage = 6;
  double temperature = 7;
}

// Telemetri Yanıtı
message TelemetryRecordResponse {
  bool success = 1;
  string message = 2;
  string telemetry_id = 3;
  string vehicle_id = 4;
  double latitude = 5;
  double longitude = 6;
  double altitude = 7;
  double speed = 8;
  double battery_percentage = 9;
  double temperature = 10;
  string timestamp = 11;
}

// En Son Telemetri İsteği
message GetLatestTelemetryRequest {
  string vehicle_id = 1;
}
